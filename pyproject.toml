[project]
name = "seo-tool"
version = "0.1.0"
description = "Data-ophaler voor de Claude Code SEO-skills: Search Console, GA4, PageSpeed, Autocomplete en paginacheck."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "google-analytics-data>=0.18",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
seo = "seo_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seo_tool"]
